<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcasts — AI Podcast Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/scripts" class="nav-link">Scripts</a>
            <a href="/voices" class="nav-link">Voices</a>
            <a href="/studio" class="nav-link">Studio</a>
            <a href="/projects" class="nav-link active">Podcasts</a>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">☀</button>
        </nav>

        <header>
            <h1>Podcasts</h1>
            <p class="subtitle">Your generated podcasts.</p>
        </header>

        <div class="list-header">
            <h2 id="project-count">— podcasts</h2>
            <input type="text" id="search-input" class="search-bar" placeholder="Filter by title or URL..." style="max-width:280px">
        </div>

        <div id="projects-list" class="section-list"></div>
        <div id="no-results" class="empty-state-scripts hidden">No podcasts match your search.</div>
    </div>

    <script>
        let allProjects = [];

        async function loadProjects() {
            const resp = await fetch('/api/projects');
            allProjects = await resp.json();
            document.getElementById('project-count').textContent = `${allProjects.length} podcast${allProjects.length !== 1 ? 's' : ''}`;
            renderProjects(allProjects);
        }

        function renderProjects(projects) {
            const list = document.getElementById('projects-list');
            const noResults = document.getElementById('no-results');
            if (!projects.length) { list.innerHTML = ''; noResults.classList.remove('hidden'); return; }
            noResults.classList.add('hidden');
            list.innerHTML = projects.map(p => {
                const date = relativeTime(p.created_at);
                const host = p.article_url ? new URL(p.article_url).hostname : '';
                return `
                    <div class="script-card-full">
                        <a href="/project/${p.id}" class="script-card-body" style="text-decoration:none;color:inherit;">
                            <div class="script-card-top">
                                <h3 class="script-card-title">${esc(p.article_title)}</h3>
                            </div>
                            <div class="script-card-meta">
                                <span class="script-card-date">${date}</span>
                                <span class="script-card-host">${host}</span>
                            </div>
                        </a>
                        <div class="script-card-actions">
                            <a href="/project/${p.id}" class="btn small primary">Listen</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('search-input').addEventListener('input', () => {
            const q = document.getElementById('search-input').value.toLowerCase();
            const filtered = q ? allProjects.filter(p =>
                (p.article_title || '').toLowerCase().includes(q) ||
                (p.article_url || '').toLowerCase().includes(q)
            ) : allProjects;
            renderProjects(filtered);
        });

        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
        function relativeTime(dateStr) { if (!dateStr) return ''; const diff = Date.now() - new Date(dateStr).getTime(); const m = Math.floor(diff / 60000); if (m < 1) return 'just now'; if (m < 60) return m + 'm ago'; const h = Math.floor(m / 60); if (h < 24) return h + 'h ago'; if (Math.floor(h / 24) < 7) return Math.floor(h / 24) + 'd ago'; return new Date(dateStr).toLocaleDateString(); }

        loadProjects();
    </script>

    <script>
function toggleTheme(){const e=document.documentElement,t=e.getAttribute("data-theme")||"dark",n="dark"===t?"light":"dark";e.setAttribute("data-theme",n),localStorage.setItem("theme",n),updateIcon(n)}
function updateIcon(e){const t=document.querySelector(".theme-toggle");t&&(t.textContent="dark"===e?"☀":"🌙")}
(function(){const e=localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",e),updateIcon(e)})();
</script>
</body>
</html>
